services:
  backend:
    image: dosibirdge/word-to-pdf-backend:latest
    container_name: document-converter-backend
    ports:
      - "127.0.0.1:9091:8000"
    volumes:
      - document_converter_uploads:/app/uploads
    environment:
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: "https://converter.dosibridge.com,https://www.converter.dosibridge.com"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: dosibirdge/word-to-pdf-frontend:latest
    container_name: document-converter-frontend
    ports:
      - "127.0.0.1:9092:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "https://converterapi.dosibridge.com"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  document_converter_uploads:
