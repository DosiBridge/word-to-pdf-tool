name: Build and Push Frontend Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'docker-compose.production.yml'
      - '.github/workflows/frontend-docker.yml'
  workflow_dispatch:

concurrency:
  group: word-to-pdf-production-deploy
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL || 'https://converterapi.dosibridge.com' }}" \
            -t word-to-pdf-frontend:latest \
            .

      - name: Push Docker image
        run: |
          docker tag word-to-pdf-frontend:latest ${{ secrets.DOCKER_USERNAME }}/word-to-pdf-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/word-to-pdf-frontend:latest

  deploy:
    name: Deploy converter frontend to DappleSoft VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
      COMPOSE_DIR: /home/dapplesoft/apps/docker-compose/word-to-pdf-tool
      COMPOSE_PROJECT: word-to-pdf-tool
      BACKEND_SERVICE: backend
      FRONTEND_SERVICE: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload production compose file
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "mkdir -p '$COMPOSE_DIR'"
          scp -i ~/.ssh/id_ed25519 -P "$PROD_PORT" docker-compose.production.yml "$PROD_USER@$PROD_HOST:$COMPOSE_DIR/docker-compose.yml"

      - name: Deploy with isolated Docker Compose project
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' COMPOSE_PROJECT='$COMPOSE_PROJECT' BACKEND_SERVICE='$BACKEND_SERVICE' FRONTEND_SERVICE='$FRONTEND_SERVICE' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          LOCK_FILE="/tmp/word-to-pdf-tool-deploy.lock"
          flock "$LOCK_FILE" bash -s <<'LOCKED_DEPLOY'
          set -euo pipefail
          cd "$COMPOSE_DIR"
          echo "Checking sibling DosiBridge root before deploy"
          curl -fsSI --max-time 15 http://127.0.0.1:8081/ >/dev/null
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml pull "$BACKEND_SERVICE" "$FRONTEND_SERVICE"
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml up -d --no-deps "$BACKEND_SERVICE" "$FRONTEND_SERVICE"
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml ps "$BACKEND_SERVICE" "$FRONTEND_SERVICE"
          curl -fsS --max-time 20 http://127.0.0.1:9091/ >/dev/null
          curl -fsSI --max-time 20 http://127.0.0.1:9092/ >/dev/null
          curl -fsSI --max-time 15 http://127.0.0.1:8081/ >/dev/null
          echo "Converter frontend deploy verified"
          LOCKED_DEPLOY
          REMOTE_DEPLOY

      - name: Verify public endpoints best-effort
        run: |
          # Cloudflare can return 403 to GitHub-hosted runners. Origin checks in the deploy step are authoritative.
          curl -sS --max-time 30 https://converterapi.dosibridge.com/ | head -c 300 || true
          curl -sSI --max-time 30 https://converter.dosibridge.com/ | head -20 || true
